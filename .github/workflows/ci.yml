name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # quant_app is a Windows desktop app (PyQt5); windows-latest matches the actual
    # runtime/dev platform and avoids Linux-only system-library setup (e.g. Qt xcb
    # platform plugins) that a headless ubuntu runner would otherwise need.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src tests -q

      - name: Run tests
        run: python -m pytest -q

  gate1:
    name: Gate 1 deterministic simulation
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Report the reviewed PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src gate1 scripts/run_gate1.py tests -q

      - name: Run Gate 1 capstone
        run: python scripts/run_gate1.py --output artifacts/gate1_report.json

      - name: Upload Gate 1 certification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate1-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/gate1_report.json
          if-no-files-found: error
          retention-days: 30
