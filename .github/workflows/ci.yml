name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # quant_app is a Windows desktop app (PyQt5); windows-latest matches the actual
    # runtime/dev platform and avoids Linux-only system-library setup (e.g. Qt xcb
    # platform plugins) that a headless ubuntu runner would otherwise need.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the same immutable source identity certified by Gate 1, not
          # GitHub's synthetic pull-request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src tests -q

      - name: Parse PC automation scripts
        shell: pwsh
        run: |
          $parseFailed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $parseFailed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent): $($_.Message)" }
            }
          }
          if ($parseFailed) { exit 1 }

      - name: Run tests
        run: python -m pytest -q

      - name: Write exact-commit matrix evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{
            schema_version = 1
            python_version = "${{ matrix.python-version }}"
            result = "PASSED"
            commit_sha = "${{ github.event.pull_request.head.sha || github.sha }}"
            workflow_run_id = "${{ github.run_id }}"
          } | ConvertTo-Json | Set-Content "artifacts/gate1-ci-${{ matrix.python-version }}.json"

      - name: Upload exact-commit matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate1-ci-python-${{ matrix.python-version }}
          path: artifacts/gate1-ci-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 30

  gate1:
    name: Gate 1 deterministic simulation
    # Gate 1 is a protected-branch check, so these dependencies make
    # repository hygiene and dependency audit transitively release-blocking.
    needs: [test, repository-hygiene, dependency-audit]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Report the reviewed PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src gate1 scripts/run_gate1.py tests -q

      - name: Download Python 3.11 and 3.12 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate1-ci-python-*
          path: artifacts/gate1-ci
          merge-multiple: true

      - name: Assemble exact-commit CI matrix
        shell: pwsh
        run: |
          $records = @(
            Get-ChildItem artifacts/gate1-ci -Filter *.json |
              ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json } |
              Sort-Object python_version
          )
          if ($records.Count -ne 2) {
            throw "Expected exactly two Python matrix records; found $($records.Count)."
          }
          $versions = @($records | ForEach-Object { $_.python_version })
          if (($versions -join ',') -ne '3.11,3.12') {
            throw "Expected Python 3.11 and 3.12 evidence; found $($versions -join ',')."
          }
          @{ ci_matrix = $records } | ConvertTo-Json -Depth 5 |
            Set-Content artifacts/gate1_ci_matrix.json

      - name: Run Gate 1 capstone
        run: >-
          python scripts/run_gate1.py
          --ci-evidence artifacts/gate1_ci_matrix.json
          --output artifacts/gate1_report.json

      - name: Upload Gate 1 certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate1-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/gate1_report.json
          if-no-files-found: error
          retention-days: 30

  repository-hygiene:
    name: Repository hygiene and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check repository-local file boundaries
        run: python scripts/check_repository_hygiene.py

      - name: Install lock-check parser
        run: python -m pip install packaging==26.3

      - name: Check direct requirements against the lock
        run: python scripts/check_requirements_lock.py

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: Locked dependency audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit the locked dependency set
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off
