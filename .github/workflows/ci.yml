name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # quant_app is a Windows desktop app (PyQt5); windows-latest matches the actual
    # runtime/dev platform and avoids Linux-only system-library setup (e.g. Qt xcb
    # platform plugins) that a headless ubuntu runner would otherwise need.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src tests -q

      - name: Run tests
        run: python -m pytest -q

  gate1:
    name: Gate 1 deterministic simulation
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Report the reviewed PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Compile check
        run: python -m compileall main.py src gate1 scripts/run_gate1.py tests -q

      - name: Run Gate 1 capstone
        run: python scripts/run_gate1.py --output artifacts/gate1_report.json

      - name: Upload Gate 1 certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate1-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/gate1_report.json
          if-no-files-found: error
          retention-days: 30

  repository-hygiene:
    name: Repository hygiene and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check repository-local file boundaries
        run: python scripts/check_repository_hygiene.py

      - name: Install lock-check parser
        run: python -m pip install packaging==26.3

      - name: Check direct requirements against the lock
        run: python scripts/check_requirements_lock.py

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: Locked dependency audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit the locked dependency set
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off
