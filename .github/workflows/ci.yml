name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # quant_app is a Windows desktop app (PyQt5); windows-latest matches the actual
    # runtime/dev platform and avoids Linux-only system-library setup (e.g. Qt xcb
    # platform plugins) that a headless ubuntu runner would otherwise need.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall main.py src tests -q

      - name: Run tests
        run: python -m pytest -q
